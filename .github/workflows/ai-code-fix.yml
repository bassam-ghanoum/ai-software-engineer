name: AI Code Fix

on:
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: read

jobs:
  ai-fix:
    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.event.issue.user.login &&
      startsWith(github.event.comment.body, '@ai-fix approve')
    runs-on: ubuntu-latest

    steps:
      - name: Get pull request information
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --json headRefOid,headRefName,baseRefOid,author \
            > pr.json

          HEAD_SHA=$(jq -r '.headRefOid' pr.json)
          HEAD_REF=$(jq -r '.headRefName' pr.json)
          BASE_SHA=$(jq -r '.baseRefOid' pr.json)
          AUTHOR=$(jq -r '.author.login' pr.json)

          echo "Pull request: #$PR_NUMBER"
          echo "Author: $AUTHOR"
          echo "Head SHA: $HEAD_SHA"
          echo "Head branch: $HEAD_REF"
          echo "Base SHA: $BASE_SHA"

          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "head_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Find successful AI Code Review run
        id: review-run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          echo "Looking for AI Code Review for:"
          echo "$HEAD_SHA"

          RUN_ID=$(gh run list \
            --repo "$REPOSITORY" \
            --workflow=ai-code-review.yml \
            --event=pull_request \
            --limit=50 \
            --json databaseId,headSha,status,conclusion \
            --jq '.[] |
              select(.headSha == env.HEAD_SHA) |
              select(.status == "completed") |
              select(.conclusion == "success") |
              .databaseId' \
            | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "No successful AI Code Review run was found for commit:"
            echo "$HEAD_SHA"
            exit 1
          fi

          echo "Found AI Code Review run:"
          echo "$RUN_ID"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Download AI review artifact
        uses: actions/download-artifact@v5
        with:
          name: ai-review-${{ steps.pr.outputs.head_sha }}
          path: ai-review
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.review-run.outputs.run_id }}

      - name: Verify downloaded review result
        env:
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -e

          echo "Downloaded artifact contents:"
          find ai-review -type f -print

          REVIEW_FILE="ai-review/review-result.json"

          if [ ! -f "$REVIEW_FILE" ]; then
            echo "Review result file was not found:"
            echo "$REVIEW_FILE"
            exit 1
          fi

          echo "Review result found:"
          echo "$REVIEW_FILE"

          REVIEW_SHA=$(php -r '
            $data = json_decode(
                file_get_contents($argv[1]),
                true,
                512,
                JSON_THROW_ON_ERROR
            );

            echo $data["commit_sha"] ?? "";
          ' "$REVIEW_FILE")

          echo "Expected SHA:"
          echo "$EXPECTED_SHA"

          echo "Review SHA:"
          echo "$REVIEW_SHA"

          if [ "$REVIEW_SHA" != "$EXPECTED_SHA" ]; then
            echo "Review result does not belong to the current PR commit."
            exit 1
          fi

          echo "Review result belongs to the current PR commit."

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run AI fix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          php bin/console ai:fix \
            "${{ steps.pr.outputs.base_sha }}" \
            "${{ steps.pr.outputs.head_sha }}" \
            --approved \
            --review-file="ai-review/review-result.json"

      - name: Commit and push fixes
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes were made."
            exit 0
          fi

          git add -A

          git commit -m "Apply AI code fixes"

          git push origin \
            HEAD:${{ steps.pr.outputs.head_ref }}
name: AI Code Fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: ai-fix-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ai-fix:
    name: ai-fix

    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.event.issue.user.login &&
      startsWith(github.event.comment.body, '@ai-fix approve')

    runs-on: ubuntu-latest

    steps:
      # ================================================================
      # Read current PR state
      # ================================================================

      - name: Read current PR state
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --json headRefOid,headRefName,baseRefOid,author \
            > pr.json

          HEAD_SHA=$(jq -r '.headRefOid' pr.json)
          HEAD_REF=$(jq -r '.headRefName' pr.json)
          BASE_SHA=$(jq -r '.baseRefOid' pr.json)
          AUTHOR=$(jq -r '.author.login' pr.json)

          echo "Pull request: #$PR_NUMBER"
          echo "Author: $AUTHOR"
          echo "Head SHA: $HEAD_SHA"
          echo "Head branch: $HEAD_REF"
          echo "Base SHA: $BASE_SHA"

          {
            echo "head_sha=$HEAD_SHA"
            echo "head_ref=$HEAD_REF"
            echo "base_sha=$BASE_SHA"
          } >> "$GITHUB_OUTPUT"

      # ================================================================
      # Detect AI-Code-Fix-agent commit
      # ================================================================

      - name: Detect Fix-Agent commit
        id: aI-code-fix-agent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MESSAGE=$(
            gh api \
              "repos/$REPOSITORY/commits/$HEAD_SHA" \
              --jq '.commit.message'
          )

          echo "Current HEAD commit message:"
          echo "$COMMIT_MESSAGE"

          if [ "$COMMIT_MESSAGE" = "Apply AI code fixes" ]; then
            echo "is_aI-code-fix-agent_commit=true" >> "$GITHUB_OUTPUT"

            echo "Current PR HEAD was created by Fix-Agent."
            echo "This approval cannot trigger another AI fix."
          else
            echo "is_aI-code-fix-agent_commit=false" >> "$GITHUB_OUTPUT"
          fi

      # ================================================================
      # Prevent reuse of the exact same approval comment
      # ================================================================

      - name: Check whether approval was already consumed
        id: approval
        if: steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          MARKER="ai-fix-approval-consumed:${COMMENT_ID}:${HEAD_SHA}"

          echo "Approval marker:"
          echo "$MARKER"

          EXISTING=$(
            gh api \
              --paginate \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              | jq -r \
                --arg MARKER "$MARKER" \
                '[.[] | select((.body // "") | contains($MARKER))] | length'
          )

          if [ "$EXISTING" -gt 0 ]; then
            echo "already_consumed=true" >> "$GITHUB_OUTPUT"

            echo "This exact approval has already been consumed."
            echo "AI-Code-Fix-agent will not run again."
          else
            echo "already_consumed=false" >> "$GITHUB_OUTPUT"

            echo "This approval has not been consumed yet."
          fi

      # ================================================================
      # Report duplicate approval
      # ================================================================

      - name: Report consumed approval
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          cat > consumed-approval.md <<EOF
          ## 🤖 AI Code Fix

          This exact \`@ai-fix approve\` comment has already been consumed.

          No additional AI fix was executed.
          EOF

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file consumed-approval.md

      # ================================================================
      # Find successful AI Code Review
      # ================================================================

      - name: Find successful AI Code Review
        id: review
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for AI Code Review for:"
          echo
          echo "HEAD: $HEAD_SHA"
          echo
          echo "BASE: $BASE_SHA"
          echo

          REVIEW_RUN_ID=$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow "ai-code-review.yml" \
              --limit 100 \
              --json "databaseId,headSha,status,conclusion" \
            | jq -r --arg SHA "$HEAD_SHA" '
                .[]
                | select(.headSha == $SHA)
                | select(.status == "completed")
                | select(.conclusion == "success")
                | .databaseId
              ' \
            | head -n 1
          )

          if [ -z "$REVIEW_RUN_ID" ]; then
            echo "No successful AI Code Review found for HEAD $HEAD_SHA."

            echo "stale_approval=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "Found successful AI Code Review:"
          echo "Run ID: $REVIEW_RUN_ID"

          echo "review_run_id=$REVIEW_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "stale_approval=false" >> "$GITHUB_OUTPUT"

      # ================================================================
      # Report stale approval
      # ================================================================

      - name: Report stale approval
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          cat > stale-approval.md <<EOF
          ## 🤖 AI Code Fix

          This approval is **stale**.

          The current PR HEAD is:

          \`$HEAD_SHA\`

          No AI fix was executed.

          Please wait for the AI Code Review for the current commit, then comment:

          \`@ai-fix approve\`
          EOF

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file stale-approval.md

      # ================================================================
      # Report AI-Code-Fix-agent commit
      # ================================================================

      - name: Report Fix-Agent commit
        if: steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          cat > aI-code-fix-agent-commit.md <<EOF
          ## 🤖 AI Code Fix

          This PR is already at a **Fix-Agent fix commit**.

          No additional AI fix was executed.
          EOF

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file aI-code-fix-agent-commit.md

      # ================================================================
      # Checkout exact PR HEAD
      # ================================================================

      - name: Checkout exact PR HEAD
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      # ================================================================
      # Setup PHP
      # ================================================================

      - name: Setup PHP
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none
          ini-file: production
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ================================================================
      # Dependencies
      # ================================================================

      - name: Install dependencies
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      # ================================================================
      # Download exact AI review artifact
      # ================================================================

      - name: Download AI review artifact
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          REVIEW_RUN_ID: ${{ steps.review.outputs.review_run_id }}
          ARTIFACT_NAME: ai-review-${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Downloading AI review artifact..."
          echo "Review run ID: $REVIEW_RUN_ID"
          echo "Artifact: $ARTIFACT_NAME"

          if ! [[ "$REVIEW_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid review run ID: $REVIEW_RUN_ID"
            exit 1
          fi

          mkdir -p ai-review

          ARTIFACT_ID=$(
            gh api \
              --paginate \
              "repos/$REPOSITORY/actions/runs/$REVIEW_RUN_ID/artifacts" \
            | jq -r \
              --arg NAME "$ARTIFACT_NAME" '
                .artifacts[]
                | select(.name == $NAME)
                | select(.expired == false)
                | .id
              ' \
            | head -n 1
          )

          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::Artifact '$ARTIFACT_NAME' was not found in review run $REVIEW_RUN_ID."
            exit 1
          fi

          echo "Artifact ID: $ARTIFACT_ID"

          gh api \
            "repos/$REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            > ai-review/artifact.zip

          unzip -o ai-review/artifact.zip -d ai-review

          rm ai-review/artifact.zip

          echo "Downloaded AI review artifact:"
          find ai-review -maxdepth 2 -type f -print

      # ================================================================
      # Validate persisted review
      # ================================================================

      - name: Validate persisted review
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval != 'true'
        id: validate-review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail

          REVIEW_FILE="ai-review/review-result.json"

          if [ ! -f "$REVIEW_FILE" ]; then
            echo "::error::review-result.json is missing."
            exit 1
          fi

          if [ ! -s "$REVIEW_FILE" ]; then
            echo "::error::review-result.json is empty."
            exit 1
          fi

          OWNER="${REPOSITORY%%/*}"
          NAME="${REPOSITORY##*/}"

          gh api graphql --paginate --slurp \
            -f query='query($owner:String!, $name:String!, $number:Int!, $endCursor:String) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$number) {
                  reviewThreads(first:100, after:$endCursor) {
                    nodes {
                      isResolved
                      comments(first:100) { nodes { body } }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }' \
            -f owner="$OWNER" \
            -f name="$NAME" \
            -F number="$PR_NUMBER" \
            > review-threads.json

          jq -r '
            .[].data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved == true)
            | .comments.nodes[]?.body // ""
            | scan("ai-code-review-fingerprint:[a-f0-9]{64}")
            | sub("ai-code-review-fingerprint:"; "")
          ' review-threads.json \
            | jq -R -s 'split("\n") | map(select(length > 0)) | unique' \
            > resolved-fingerprints.json

          php bin/console ai:review:filter-resolved \
            "$REVIEW_FILE" \
            resolved-fingerprints.json

          rm -f review-threads.json resolved-fingerprints.json

          FINDINGS_COUNT=$(jq '[.reviews[]?.findings[]?] | length' "$REVIEW_FILE")

          if [ "$FINDINGS_COUNT" = "0" ]; then
            echo "findings_count=0" >> "$GITHUB_OUTPUT"
            echo "All persisted review findings were already resolved. No AI fix is required."
            exit 0
          fi

          php bin/console ai:review:validate-result \
            "$REVIEW_FILE" \
            --commit-sha="$EXPECTED_SHA" \
            --base-sha="$EXPECTED_BASE_SHA"

          REVIEW_SHA=$(jq -r '.commit_sha' "$REVIEW_FILE")
          REVIEW_BASE_SHA=$(jq -r '.base_sha' "$REVIEW_FILE")

          echo "Expected SHA:      $EXPECTED_SHA"
          echo "Review SHA:        $REVIEW_SHA"
          echo "Expected base SHA: $EXPECTED_BASE_SHA"
          echo "Review base SHA:   $REVIEW_BASE_SHA"
          echo "Findings:          $FINDINGS_COUNT"

          if [ "$REVIEW_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Review result does not belong to the current PR HEAD."
            exit 1
          fi

          if [ "$REVIEW_BASE_SHA" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::Review result does not belong to the current PR BASE."
            exit 1
          fi

          echo "findings_count=$FINDINGS_COUNT" >> "$GITHUB_OUTPUT"

          echo "Review result is valid and contains findings."

      # ================================================================
      # Run Fix-Agent
      #
      # IMPORTANT:
      #
      # The approval is NOT consumed yet.
      #
      # If AI-Code-Fix-agent fails, the same approval remains usable.
      # ================================================================

      - name: Run Fix-Agent
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RETRY_DELAY: 1
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ steps.pr.outputs.base_sha }}"
          HEAD_SHA="${{ steps.pr.outputs.head_sha }}"

          echo "Using persisted AI review from:"
          echo "ai-review/review-result.json"

          php bin/console ai:fix \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            --approved \
            --review-file="ai-review/review-result.json"

      # ================================================================
      # Remove review artifact
      # ================================================================

      - name: Remove review artifact
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        run: |
          rm -rf ai-review
          rm -f pr.json

      # ================================================================
      # Run complete PHPUnit test suite
      #
      # IMPORTANT:
      #
      # Tests MUST pass before commit/push.
      # ================================================================

      - name: Run full test suite
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          echo "Running complete PHPUnit test suite..."

          php ./bin/phpunit tests/ --display-all-issues

          echo
          echo "All tests passed."
          echo "AI-Code-Fix-agent is allowed to commit and push."

      # ================================================================
      # Detect whether AI-Code-Fix-agent actually changed anything
      # ================================================================

      - name: Detect AI changes
        id: changes
        if: >
          steps.aI-code-fix-agent.outputs.is_aI-code-fix-agent_commit != 'true' &&
          steps.approval.outputs.already_consumed != 'true' &&
          steps.review.outputs.stale_approval != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"

            echo "AI-Code-Fix-agent made no changes."
            echo "No commit will be created."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"

            echo "AI-Code-Fix-agent produced changes:"
            git status --short
          fi

      # ================================================================
      # Commit and push fixes
      # ================================================================

      - name: Commit and push fixes
        if: >
          success() &&
          steps.changes.outputs.has_changes == 'true'
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "AI Code Fix"
          git config user.email "ai-code-fix@users.noreply.github.com"

          git add -A

          git commit -m "Apply AI code fixes"

          git push origin \
            "HEAD:${HEAD_REF}"

      # ================================================================
      # Resolve AI review threads after the fix commit is pushed
      # ================================================================

      - name: Resolve AI review threads
        if: >
          success() &&
          steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.AI_REVIEW_TOKEN || secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f unresolved-ai-thread-ids.txt' EXIT

          OWNER="${REPOSITORY%%/*}"
          NAME="${REPOSITORY##*/}"

          gh api graphql --paginate --slurp \
            -f query='query($owner:String!, $name:String!, $number:Int!, $endCursor:String) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$number) {
                  reviewThreads(first:100, after:$endCursor) {
                    nodes {
                      id
                      isResolved
                      comments(first:100) { nodes { body } }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }' \
            -f owner="$OWNER" \
            -f name="$NAME" \
            -F number="$PR_NUMBER" \
            | jq -r '
              .[].data.repository.pullRequest.reviewThreads.nodes[]
              | select(.isResolved == false)
              | select(
                  [
                    .comments.nodes[]?.body // ""
                    | test("ai-code-review-fingerprint:[a-f0-9]{64}")
                  ] | any
                )
              | .id
            ' > unresolved-ai-thread-ids.txt

          RESOLVED=0

          while IFS= read -r THREAD_ID; do
            [ -z "$THREAD_ID" ] && continue

            gh api graphql \
              -f query='mutation($threadId:ID!) {
                resolveReviewThread(input:{threadId:$threadId}) {
                  thread { isResolved }
                }
              }' \
              -f threadId="$THREAD_ID" \
              > /dev/null

            RESOLVED=$((RESOLVED + 1))
          done < unresolved-ai-thread-ids.txt

          echo "Resolved AI review threads after fix push: $RESOLVED"

      # ================================================================
      # Consume approval
      #
      # This happens AFTER AI-Code-Fix-agent, PHPUnit and push succeeded.
      #
      # Therefore:
      #
      #   AI-Code-Fix-agent failure  -> approval remains reusable
      #   PHPUnit failure  -> approval remains reusable
      #   Push failure     -> approval remains reusable
      #   Successful push  -> approval becomes consumed
      # ================================================================

      - name: Consume approval
        id: consume
        if: >
          success() &&
          steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail

          MARKER="ai-fix-approval-consumed:${COMMENT_ID}:${HEAD_SHA}"

          cat > approval-consumed.md <<EOF
          ## 🤖 AI Code Fix

          Approval consumed successfully.

          **Reviewed commit:** \`$HEAD_SHA\`

          **Base SHA:** \`$BASE_SHA\`

          AI-Code-Fix-agent successfully applied the persisted Agent 1 findings and pushed the fix commit.

          <!-- $MARKER -->
          EOF

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file approval-consumed.md

          echo "approval_marked=true" >> "$GITHUB_OUTPUT"

      # ================================================================
      # Report no changes
      #
      # No approval-consumed marker is written.
      #
      # This allows the developer to investigate/retry with a new
      # approval if AI-Code-Fix-agent unexpectedly produced no changes.
      # ================================================================

      - name: Report no AI changes
        if: >
          success() &&
          steps.changes.outputs.has_changes == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          cat > no-ai-changes.md <<EOF
          ## 🤖 AI Code Fix

          AI-Code-Fix-agent completed successfully, but no source changes were produced.

          No AI fix commit was created.
          EOF

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file no-ai-changes.md

      # ================================================================
      # Rename PR after AI-Code-Fix-agent push
      #
      # PR title:
      #
      #   PR-<original developer commit subject>
      #
      # This runs only after an actual AI-Code-Fix-agent commit was pushed.
      # ================================================================

      - name: Rename PR after AI-Code-Fix-agent push
        if: >
          success() &&
          steps.consume.outputs.approval_marked == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ORIGINAL_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          ORIGINAL_COMMIT_SUBJECT=$(
            gh api \
              "repos/$REPOSITORY/commits/$ORIGINAL_SHA" \
              --jq '.commit.message' |
            head -n 1
          )

          if [ -z "$ORIGINAL_COMMIT_SUBJECT" ]; then
            echo "::error::Original commit subject is empty."
            exit 1
          fi

          PR_TITLE="PR-$ORIGINAL_COMMIT_SUBJECT"

          echo "Original commit subject:"
          echo "$ORIGINAL_COMMIT_SUBJECT"

          echo
          echo "New PR title:"
          echo "$PR_TITLE"

          gh pr edit "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --title "$PR_TITLE"
name: AI Code Fix

on:
  pull_request_review:
    types:
      - submitted

permissions:
  contents: write
  pull-requests: read
  actions: read

jobs:
  ai-fix:
    if: github.event.review.state == 'approved'
    runs-on: ubuntu-latest

    steps:
      - name: Find successful AI Code Review run
        id: review-run
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e

          echo "Looking for AI Code Review for:"
          echo "$HEAD_SHA"

          RUN_ID=$(gh run list \
            --workflow=ai-code-review.yml \
            --event=pull_request \
            --limit=50 \
            --json databaseId,headSha,status,conclusion \
            --jq '.[] |
              select(.headSha == env.HEAD_SHA) |
              select(.status == "completed") |
              select(.conclusion == "success") |
              .databaseId' \
            | head -n 1)

          if [ -z "$RUN_ID" ]; then
            echo "No successful AI Code Review run was found for commit:"
            echo "$HEAD_SHA"
            exit 1
          fi

          echo "Found AI Code Review run:"
          echo "$RUN_ID"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download AI review artifact
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.review-run.outputs.run_id }}
        run: |
          set -e

          mkdir -p ai-review

          gh run download \
            "$RUN_ID" \
            --name "ai-review-${{ github.event.pull_request.head.sha }}" \
            --dir ai-review

          echo "Downloaded review artifact:"
          find ai-review -maxdepth 2 -type f -print

      - name: Verify review result
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e

          REVIEW_FILE="ai-review/review-result.json"

          if [ ! -f "$REVIEW_FILE" ]; then
            echo "Review result file was not found:"
            echo "$REVIEW_FILE"
            exit 1
          fi

          REVIEW_SHA=$(php -r '
            $data = json_decode(
                file_get_contents($argv[1]),
                true,
                512,
                JSON_THROW_ON_ERROR
            );

            echo $data["commit_sha"] ?? "";
          ' "$REVIEW_FILE")

          echo "Expected SHA:"
          echo "$EXPECTED_SHA"

          echo "Review SHA:"
          echo "$REVIEW_SHA"

          if [ "$REVIEW_SHA" != "$EXPECTED_SHA" ]; then
            echo "Review result does not belong to the current PR commit."
            exit 1
          fi

          echo "Review result belongs to the current PR commit."

      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Determine Git revisions
        id: revisions
        run: |
          echo "from=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          echo "to=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      - name: Run AI fix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          php bin/console ai:fix \
            "${{ steps.revisions.outputs.from }}" \
            "${{ steps.revisions.outputs.to }}" \
            --approved \
            --review-file=ai-review/review-result.json

      - name: Commit and push fixes
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes were made."
            exit 0
          fi

          git add -A

          git commit -m "Apply AI code fixes"

          git push origin \
            HEAD:${{ github.event.pull_request.head.ref }}
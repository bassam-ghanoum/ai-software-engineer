name: AI Code Fix

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: ai-fix-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  ai-fix:
    name: ai-fix
    if: >
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.event.issue.user.login &&
      startsWith(github.event.comment.body, '@ai-fix approve')
    runs-on: ubuntu-latest

    steps:
      - name: Read current PR state
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --json headRefOid,headRefName,baseRefOid,author \
            > pr.json

          HEAD_SHA=$(jq -r '.headRefOid' pr.json)
          HEAD_REF=$(jq -r '.headRefName' pr.json)
          BASE_SHA=$(jq -r '.baseRefOid' pr.json)
          AUTHOR=$(jq -r '.author.login' pr.json)

          echo "Pull request: #$PR_NUMBER"
          echo "Author: $AUTHOR"
          echo "Head SHA: $HEAD_SHA"
          echo "Head branch: $HEAD_REF"
          echo "Base SHA: $BASE_SHA"

          {
            echo "head_sha=$HEAD_SHA"
            echo "head_ref=$HEAD_REF"
            echo "base_sha=$BASE_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Detect Agent 2 commit
        id: agent2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MESSAGE=$(
            gh api \
              "repos/$REPOSITORY/commits/$HEAD_SHA" \
              --jq '.commit.message'
          )

          echo "Current HEAD commit message:"
          echo "$COMMIT_MESSAGE"

          if [ "$COMMIT_MESSAGE" = "Apply AI code fixes" ]; then
            echo "is_agent2_commit=true" >> "$GITHUB_OUTPUT"
            echo "Current PR HEAD was created by Agent 2."
            echo "This approval cannot trigger another AI fix."
          else
            echo "is_agent2_commit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find successful AI Code Review
        id: review
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Looking for AI Code Review for:"
          echo
          echo "HEAD: $HEAD_SHA"
          echo
          echo "BASE: $BASE_SHA"
          echo

          REVIEW_RUN_ID=$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow "ai-code-review.yml" \
              --limit 100 \
              --json "databaseId,headSha,status,conclusion" \
            | jq -r --arg SHA "$HEAD_SHA" '
                .[]
                | select(.headSha == $SHA)
                | select(.status == "completed")
                | select(.conclusion == "success")
                | .databaseId
              ' \
            | head -n 1
          )

          if [ -z "$REVIEW_RUN_ID" ]; then
            echo "No successful AI Code Review found for HEAD $HEAD_SHA."

            echo "stale_approval=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          echo "Found successful AI Code Review:"
          echo "Run ID: $REVIEW_RUN_ID"

          echo "review_run_id=$REVIEW_RUN_ID" >> "$GITHUB_OUTPUT"
          
      - name: Report stale approval
        if: steps.agent2.outputs.is_agent2_commit != 'true' && steps.review.outputs.stale_approval == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          cat > stale-approval.md <<EOF
          ## 🤖 AI Code Fix

          This approval is **stale**.

          The current PR HEAD is:

          \`$HEAD_SHA\`

          No AI fix was executed.

          Please wait for the AI Code Review for the current commit, then comment:

          \`@ai-fix approve\`
          EOF

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file stale-approval.md

      - name: Report Agent 2 commit
        if: steps.agent2.outputs.is_agent2_commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail

          cat > agent2-commit.md <<EOF
          ## 🤖 AI Code Fix

          This PR is already at an **Agent 2 fix commit**.

          No additional AI fix was executed.
          EOF

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file agent2-commit.md

      - name: Checkout exact PR HEAD
        if: steps.agent2.outputs.is_agent2_commit != 'true' && steps.review.outputs.stale_approval != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Setup PHP
        if: steps.agent2.outputs.is_agent2_commit != 'true' && steps.review.outputs.stale_approval != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none
          ini-file: production
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.agent2.outputs.is_agent2_commit != 'true' && steps.review.outputs.stale_approval != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Download exact review artifact
        if: steps.agent2.outputs.is_agent2_commit != 'true' && steps.review.outputs.stale_approval != 'true'
        uses: actions/download-artifact@v5
        with:
          name: ${{ steps.review.outputs.artifact_name }}
          path: ai-review
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.review.outputs.run_id }}

      - name: Validate persisted review
        if: steps.agent2.outputs.is_agent2_commit != 'true' && steps.review.outputs.stale_approval != 'true'
        id: validate-review
        env:
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
          EXPECTED_BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        shell: bash
        run: |
          set -euo pipefail

          REVIEW_FILE="ai-review/review-result.json"

          if [ ! -f "$REVIEW_FILE" ]; then
            echo "Review artifact is invalid: review-result.json is missing."
            exit 1
          fi

          if [ ! -s "$REVIEW_FILE" ]; then
            echo "Review artifact is invalid: review-result.json is empty."
            exit 1
          fi

          php -r '
          $data = json_decode(
              file_get_contents($argv[1]),
              true,
              512,
              JSON_THROW_ON_ERROR
          );

          foreach (["commit_sha", "base_sha"] as $field) {
              if (
                  !isset($data[$field]) ||
                  !is_string($data[$field]) ||
                  $data[$field] === ""
              ) {
                  fwrite(
                      STDERR,
                      "Missing or invalid {$field}.\n"
                  );
                  exit(1);
              }
          }

          if (
              isset($data["findings"]) &&
              !is_array($data["findings"])
          ) {
              fwrite(
                  STDERR,
                  "Invalid findings structure.\n"
              );
              exit(1);
          }
          ' "$REVIEW_FILE"

          REVIEW_SHA=$(jq -r '.commit_sha' "$REVIEW_FILE")
          REVIEW_BASE_SHA=$(jq -r '.base_sha' "$REVIEW_FILE")

          echo "Expected SHA:      $EXPECTED_SHA"
          echo "Review SHA:        $REVIEW_SHA"
          echo "Expected base SHA: $EXPECTED_BASE_SHA"
          echo "Review base SHA:   $REVIEW_BASE_SHA"

          if [ "$REVIEW_SHA" != "$EXPECTED_SHA" ]; then
            echo "Review result does not belong to the current PR HEAD."
            exit 1
          fi

          if [ "$REVIEW_BASE_SHA" != "$EXPECTED_BASE_SHA" ]; then
            echo "Review result does not belong to the current PR BASE."
            exit 1
          fi

          echo "Review result is valid and bound to the current HEAD and BASE."

      - name: Run Agent 2
        if: steps.agent2.outputs.is_agent2_commit != 'true' && steps.review.outputs.stale_approval != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RETRY_DELAY: 1
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ steps.pr.outputs.base_sha }}"
          HEAD_SHA="${{ steps.pr.outputs.head_sha }}"

          echo "Using persisted AI review from:"
          echo "ai-review/review-result.json"

          php bin/console ai:fix \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            --approved \
            --review-file="ai-review/review-result.json"

      - name: Remove review artifact
        if: steps.agent2.outputs.is_agent2_commit != 'true' && steps.review.outputs.stale_approval != 'true'
        run: rm -rf ai-review

      - name: Commit and push fixes
        if: steps.agent2.outputs.is_agent2_commit != 'true' && steps.review.outputs.stale_approval != 'true'
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No changes were made."
            exit 0
          fi

          git config user.name "AI Code Fix"
          git config user.email "ai-code-fix@users.noreply.github.com"

          git add -A
          git commit -m "Apply AI code fixes"

          git push origin \
            "HEAD:${HEAD_REF}"
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-code-review:
    name: ai-code-review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Fix-agent commit
        id: agent2
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MESSAGE=$(git log -1 --pretty=%B "${{ github.event.pull_request.head.sha }}")

          echo "Latest commit:"
          echo "${COMMIT_MESSAGE}"

          if [ "$COMMIT_MESSAGE" = "Apply AI code fixes" ]; then
            echo "is_agent2_commit=true" >> "$GITHUB_OUTPUT"
            echo "This commit was created by Fix-agent. Skipping AI Code Review."
          else
            echo "is_agent2_commit=false" >> "$GITHUB_OUTPUT"
            echo "This commit was created by the developer. AI Code Review will run."
          fi

      - name: Setup PHP
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none
          ini-file: production
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run AI Code Review
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RETRY_DELAY: 1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Reviewing PHP changes: $BASE_SHA → $HEAD_SHA"

          php bin/console ai:review \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            --output=review-result.json \
            | tee ai-review.txt

          test -f review-result.json

          echo "Binding review-result.json to:"
          echo "commit_sha = $HEAD_SHA"
          echo "base_sha   = $BASE_SHA"

          php -r '
          $file = "review-result.json";

          $data = json_decode(
              file_get_contents($file),
              true,
              512,
              JSON_THROW_ON_ERROR
          );

          $data["commit_sha"] = $data["commit_sha"] ?? getenv("HEAD_SHA");
          $data["base_sha"] = getenv("BASE_SHA");

          file_put_contents(
              $file,
              json_encode(
                  $data,
                  JSON_PRETTY_PRINT |
                  JSON_UNESCAPED_SLASHES |
                  JSON_THROW_ON_ERROR
              ) . PHP_EOL
          );
          '

      - name: Validate review result
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          REVIEW_FILE="review-result.json"
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          EXPECTED_BASE_SHA="${{ github.event.pull_request.base.sha }}"

          test -s "$REVIEW_FILE"

          php -r '
          $data = json_decode(
              file_get_contents($argv[1]),
              true,
              512,
              JSON_THROW_ON_ERROR
          );

          foreach (["commit_sha", "base_sha"] as $field) {
              if (
                  !isset($data[$field]) ||
                  !is_string($data[$field]) ||
                  $data[$field] === ""
              ) {
                  fwrite(
                      STDERR,
                      "Missing or invalid {$field} in review result.\n"
                  );
                  exit(1);
              }
          }

          if (
              isset($data["findings"]) &&
              !is_array($data["findings"])
          ) {
              fwrite(
                  STDERR,
                  "Invalid findings structure.\n"
              );
              exit(1);
          }
          ' "$REVIEW_FILE"

          REVIEW_SHA=$(jq -r '.commit_sha' "$REVIEW_FILE")
          REVIEW_BASE_SHA=$(jq -r '.base_sha' "$REVIEW_FILE")

          echo "Expected commit SHA: $EXPECTED_SHA"
          echo "Review commit SHA:   $REVIEW_SHA"
          echo "Expected base SHA:   $EXPECTED_BASE_SHA"
          echo "Review base SHA:     $REVIEW_BASE_SHA"

          if [ "$REVIEW_SHA" != "$EXPECTED_SHA" ]; then
            echo "Review result does not belong to the current PR commit."
            exit 1
          fi

          if [ "$REVIEW_BASE_SHA" != "$EXPECTED_BASE_SHA" ]; then
            echo "Review result belongs to a different PR base."
            exit 1
          fi

          echo "Review result is bound to the current PR HEAD and BASE."

      - name: Debug review result structure
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "===== review-result.json ====="
          cat review-result.json

          echo
          echo "===== top-level JSON keys ====="
          jq -r 'keys[]' review-result.json

      - name: Upload review artifact
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.pull_request.head.sha }}
          path: review-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Prepare changed lines
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git diff \
            --no-color \
            --unified=0 \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            -- '*.php' \
            > changed-lines.diff

          echo "Changed PHP diff:"
          cat changed-lines.diff

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $diff = file_get_contents('changed-lines.diff');

          $changedLines = [];
          $currentFile = null;
          $currentLine = null;
          $currentCount = 0;

          foreach (preg_split('/\R/', $diff) as $line) {
              if (str_starts_with($line, '+++ b/')) {
                  $currentFile = substr($line, 6);
                  $currentLine = null;
                  $currentCount = 0;

                  echo "File: {$currentFile}\n";

                  continue;
              }

              if (
                  preg_match(
                      '/^@@\s+-\d+(?:,\d+)?\s+\+(\d+)(?:,(\d+))?/ ',
                      $line,
                      $matches
                  )
              ) {
                  $currentLine = (int) $matches[1];
                  $currentCount = isset($matches[2])
                      ? (int) $matches[2]
                      : 1;

                  echo sprintf(
                      "Hunk: %s line=%d count=%d\n",
                      $currentFile ?? 'unknown',
                      $currentLine,
                      $currentCount
                  );

                  if (
                      $currentFile !== null &&
                      $currentCount > 0
                  ) {
                      $changedLines[$currentFile] ??= [];

                      for ($i = 0; $i < $currentCount; $i++) {
                          $changedLines[$currentFile][] =
                              $currentLine + $i;
                      }
                  }

                  continue;
              }
          }

          foreach ($changedLines as $file => $lines) {
              $lines = array_values(array_unique($lines));
              sort($lines);

              $changedLines[$file] = $lines;

              echo sprintf(
                  "Changed lines: %s => %s\n",
                  $file,
                  implode(', ', $lines)
              );
          }

          file_put_contents(
              'changed-lines.json',
              json_encode(
                  $changedLines,
                  JSON_PRETTY_PRINT |
                  JSON_UNESCAPED_SLASHES |
                  JSON_THROW_ON_ERROR
              ) . PHP_EOL
          );

          echo "Changed-line map prepared.\n";
          PHP

      - name: Post AI review comments
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Preparing AI review comments..."

          php -r '
          $data = json_decode(file_get_contents("review-result.json"), true, 512, JSON_THROW_ON_ERROR);

          $diff = file_get_contents("changed-lines.diff");

          $changedLines = [];
          $currentFile = null;

          $lines = preg_split("/\\r?\\n/", $diff);

          foreach ($lines as $diffLine) {
              if (preg_match("/^\\+\\+\\+ b\\/(.+)$/", $diffLine, $matches)) {
                  $currentFile = $matches[1];
                  $changedLines[$currentFile] ??= [];
                  continue;
              }

              if ($currentFile === null) {
                  continue;
              }

              if (preg_match("/^@@ .* \\+(\\d+)(?:,(\\d+))? @@/", $diffLine, $matches)) {
                  $start = (int) $matches[1];
                  $count = isset($matches[2]) ? (int) $matches[2] : 1;

                  for ($line = $start; $line < $start + $count; $line++) {
                      $changedLines[$currentFile][$line] = true;
                  }
              }
          }

          $inlineComments = [];
          $generalFindings = [];

          foreach ($data["reviews"] ?? [] as $file => $review) {
              if (!is_array($review)) {
                  continue;
              }

              if (!isset($review["findings"]) || !is_array($review["findings"])) {
                  continue;
              }

              $file = ltrim((string) $file, "/");

              foreach ($review["findings"] as $finding) {
                  $line = (int) ($finding["line"] ?? 0);

                  if ($line <= 0) {
                      continue;
                  }

                  $severity = strtoupper((string) ($finding["severity"] ?? "unknown"));
                  $category = (string) ($finding["category"] ?? "unknown");
                  $message = trim((string) ($finding["message"] ?? ""));
                  $suggestion = trim((string) ($finding["suggestion"] ?? ""));

                  $body = "### 🤖 AI Code Review\n\n";
                  $body .= "**{$severity}** · `{$category}`\n\n";
                  $body .= $message;

                  if ($suggestion !== "") {
                      $body .= "\n\n**Suggestion:** {$suggestion}";
                  }

                  if (isset($changedLines[$file][$line])) {
                      $inlineComments[] = [
                          "path" => $file,
                          "line" => $line,
                          "side" => "RIGHT",
                          "body" => $body,
                      ];
                  } else {
                      $generalFindings[] = [
                          "file" => $file,
                          "line" => $line,
                          "severity" => $severity,
                          "category" => $category,
                          "message" => $message,
                          "suggestion" => $suggestion,
                      ];
                  }
              }
          }

          file_put_contents(
              "review-inline-comments.json",
              json_encode(
                  $inlineComments,
                  JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_UNESCAPED_UNICODE
              )
          );

          if ($generalFindings === []) {
              file_put_contents("review-general-comment.md", "");
          } else {
              $body = "<!-- ai-code-review:" . getenv("HEAD_SHA") . " -->\n";
              $body .= "## 🤖 AI Code Review\n\n";
              $body .= "The following findings are in changed PHP files, but their reported lines are not part of the changed lines in this PR. They are therefore shown here instead of as inline comments.\n\n";

              foreach ($generalFindings as $finding) {
                  $body .= "### `{$finding["file"]}:{$finding["line"]}`\n\n";
                  $body .= "**{$finding["severity"]}** · `{$finding["category"]}`\n\n";
                  $body .= $finding["message"];

                  if ($finding["suggestion"] !== "") {
                      $body .= "\n\n**Suggestion:** {$finding["suggestion"]}";
                  }

                  $body .= "\n\n---\n\n";
              }

              file_put_contents("review-general-comment.md", $body);
          }

          echo "Changed lines:\n";

          if ($changedLines === []) {
              echo "  NONE\n";
          } else {
              foreach ($changedLines as $file => $lines) {
                  $lineNumbers = array_keys($lines);
                  sort($lineNumbers, SORT_NUMERIC);

                  echo "  {$file}: " . implode(", ", $lineNumbers) . "\n";
              }
          }

          echo "Prepared " . count($inlineComments) . " inline comment(s).\n";
          echo "Prepared " . count($generalFindings) . " general finding(s).\n";
          '

          INLINE_COUNT=$(jq 'length' review-inline-comments.json)

          echo "Inline comment count: $INLINE_COUNT"

          if [ "$INLINE_COUNT" -gt 0 ]; then
            echo "Posting inline PR comments..."

            while IFS= read -r comment; do
              BODY=$(echo "$comment" | jq -r '.body')
              PATH_VALUE=$(echo "$comment" | jq -r '.path')
              LINE=$(echo "$comment" | jq -r '.line')
              SIDE=$(echo "$comment" | jq -r '.side')

              echo "Posting inline comment: ${PATH_VALUE}:${LINE}"

              gh api \
                --method POST \
                "repos/$REPOSITORY/pulls/$PR_NUMBER/comments" \
                -f body="$BODY" \
                -f commit_id="$HEAD_SHA" \
                -f path="$PATH_VALUE" \
                -F line="$LINE" \
                -f side="$SIDE"
            done < <(jq -c '.[]' review-inline-comments.json)
          else
            echo "No inline comments to post."
          fi

          if [ -s review-general-comment.md ]; then
            echo "Posting general PR comment..."

            gh api \
              --method POST \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$(cat review-general-comment.md)"

            echo "General AI review comment posted."
          else
            echo "No general findings to post."
          fi
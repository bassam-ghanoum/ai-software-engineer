name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-code-review:
    name: ai-code-review
    runs-on: ubuntu-latest

    steps:
      # ================================================================
      # Checkout
      # ================================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ================================================================
      # Detect AI-Code-Fix-agent commit
      #
      # AI-Code-Fix-agent creates:
      #
      #   Apply AI code fixes
      #
      # We must NOT run Agent 1 again for that commit.
      # ================================================================

      - name: Detect Fix-Agent commit
        id: ai-code-fix-agent
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MESSAGE=$(
            git log -1 \
              --pretty=%B \
              "${{ github.event.pull_request.head.sha }}"
          )

          echo "Latest commit:"
          echo "$COMMIT_MESSAGE"

          if [ "$COMMIT_MESSAGE" = "Apply AI code fixes" ]; then
            echo "is_ai-code-fix-agent_commit=true" >> "$GITHUB_OUTPUT"

            echo "This commit was created by Fix-Agent."
            echo "Skipping AI Code Review."
          else
            echo "is_ai-code-fix-agent_commit=false" >> "$GITHUB_OUTPUT"

            echo "This commit was created by the developer."
            echo "AI Code Review will run."
          fi

      # ================================================================
      # PHP
      # ================================================================

      - name: Setup PHP
        if: steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none
          ini-file: production
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ================================================================
      # Dependencies
      # ================================================================

      - name: Install dependencies
        if: steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      # ================================================================
      # Run Agent 1
      # ================================================================

      - name: Run AI Code Review
        if: steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RETRY_DELAY: 1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Reviewing PHP changes:"
          echo "$BASE_SHA → $HEAD_SHA"

          php bin/console ai:review \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            --output=review-result.json \
            | tee ai-review.txt

          test -f review-result.json

      - name: Bind review result to pull request
        if: steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          php bin/console ai:review:bind-result \
            review-result.json \
            --commit-sha="$HEAD_SHA" \
            --base-sha="$BASE_SHA"

      # ================================================================
      # Validate persisted review
      # ================================================================

      - name: Validate review result
        if: steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true'
        id: validate-review
        shell: bash
        run: |
          set -euo pipefail

          REVIEW_FILE="review-result.json"
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          EXPECTED_BASE_SHA="${{ github.event.pull_request.base.sha }}"

          if [ ! -f "$REVIEW_FILE" ]; then
            echo "::error::review-result.json is missing."
            exit 1
          fi

          if [ ! -s "$REVIEW_FILE" ]; then
            echo "::error::review-result.json is empty."
            exit 1
          fi

          REVIEW_SHA=$(jq -r '.commit_sha' "$REVIEW_FILE")
          REVIEW_BASE_SHA=$(jq -r '.base_sha' "$REVIEW_FILE")

          FINDINGS_COUNT=$(
            jq '[.reviews[]?.findings[]?] | length' "$REVIEW_FILE"
          )

          echo "Expected commit SHA: $EXPECTED_SHA"
          echo "Review commit SHA:   $REVIEW_SHA"
          echo
          echo "Expected base SHA:   $EXPECTED_BASE_SHA"
          echo "Review base SHA:     $REVIEW_BASE_SHA"
          echo
          echo "Total findings:      $FINDINGS_COUNT"

          if [ "$REVIEW_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Review result does not belong to the current PR commit."
            exit 1
          fi

          if [ "$REVIEW_BASE_SHA" != "$EXPECTED_BASE_SHA" ]; then
            echo "::error::Review result belongs to a different PR base."
            exit 1
          fi

          echo "findings_count=$FINDINGS_COUNT" >> "$GITHUB_OUTPUT"

          echo
          echo "Review result is correctly bound to the current PR HEAD and BASE."

      # ================================================================
      # Resolve findings from earlier AI review runs
      # ================================================================

      - name: Resolve previous AI review threads
        if: steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          OWNER="${REPOSITORY%%/*}"
          NAME="${REPOSITORY##*/}"

          gh api graphql --paginate --slurp \
            -f query='query($owner:String!, $name:String!, $number:Int!, $endCursor:String) {
              repository(owner:$owner, name:$name) {
                pullRequest(number:$number) {
                  reviewThreads(first:100, after:$endCursor) {
                    nodes {
                      id
                      isResolved
                      comments(first:100) { nodes { body } }
                    }
                    pageInfo { hasNextPage endCursor }
                  }
                }
              }
            }' \
            -f owner="$OWNER" \
            -f name="$NAME" \
            -F number="$PR_NUMBER" \
            > review-threads.json

          AI_THREAD_IDS=$(jq -r '
            .[].data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved == false)
            | select(
                [
                  .comments.nodes[]?.body // ""
                  | test("ai-code-review-fingerprint:[a-f0-9]{64}")
                ] | any
              )
            | .id
          ' review-threads.json)

          RESOLVED=0

          while IFS= read -r THREAD_ID; do
            [ -z "$THREAD_ID" ] && continue

            gh api graphql \
              -f query='mutation($threadId:ID!) {
                resolveReviewThread(input:{threadId:$threadId}) {
                  thread { isResolved }
                }
              }' \
              -f threadId="$THREAD_ID" \
              > /dev/null

            RESOLVED=$((RESOLVED + 1))
          done <<< "$AI_THREAD_IDS"

          rm -f review-threads.json

          echo "Resolved previous AI review threads: $RESOLVED"

      # ================================================================
      # No findings
      #
      # A finding-free review must never enter the approval/fix loop.
      # ================================================================

      - name: Report no findings
        if: >
          steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true' &&
          steps.validate-review.outputs.findings_count == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          MARKER="ai-code-review-no-findings:$HEAD_SHA"

          EXISTING=$(
            gh api \
              --paginate \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              | jq -r \
                --arg MARKER "$MARKER" \
                '[.[] | select((.body // "") | contains($MARKER))] | length'
          )

          if [ "$EXISTING" -gt 0 ]; then
            echo "No-findings notification already exists for $HEAD_SHA."
            exit 0
          fi

          cat > no-findings.md <<EOF
          ## 🤖 AI Code Review

          No findings were detected for this commit.

          **No AI fix is required.**

          <!-- $MARKER -->
          EOF

          gh pr comment "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --body-file no-findings.md

      # ================================================================
      # Upload exact review artifact
      #
      # AI-Code-Fix-agent later downloads this exact artifact for this exact SHA.
      # ================================================================

      - name: Upload review artifact
        if: steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.pull_request.head.sha }}
          path: review-result.json
          if-no-files-found: error
          retention-days: 7

      # ================================================================
      # Calculate changed PHP lines
      # ================================================================

      - name: Prepare changed lines
        if: >
          steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git diff \
            --no-color \
            --unified=0 \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            -- '*.php' \
            > changed-lines.diff

          echo "Changed PHP diff:"
          cat changed-lines.diff

          php bin/console ai:review:prepare-comments \
            review-result.json \
            changed-lines.diff \
            --changed-lines-output=changed-lines.json \
            --inline-output=review-inline-comments.json \
            --general-output=review-general-comments.json

      # ================================================================
      # Load existing AI comments
      # ================================================================

      - name: Load existing AI review comments
        if: >
          steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Loading existing inline PR comments..."

          gh api \
            --paginate \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/comments?per_page=100" \
            > existing-inline-pages.json

          echo "Loading existing general PR comments..."

          gh api \
            --paginate \
            "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            > existing-general-pages.json

          jq -s 'add // []' \
            existing-inline-pages.json \
            > existing-inline-comments.json

          jq -s 'add // []' \
            existing-general-pages.json \
            > existing-general-comments.json

          echo
          echo "Existing inline comments:"
          jq 'length' existing-inline-comments.json

          echo "Existing general comments:"
          jq 'length' existing-general-comments.json

      # ================================================================
      # Remove duplicate fingerprinted comments
      # ================================================================

      - name: Remove duplicate AI review comments
        if: >
          steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          declare -A SEEN_FINGERPRINTS=()

          echo "Checking inline comments for duplicates..."

          while IFS= read -r comment; do
            COMMENT_ID=$(echo "$comment" | jq -r '.id')
            BODY=$(echo "$comment" | jq -r '.body // ""')

            FINGERPRINT=$(
              printf '%s\n' "$BODY" \
                | sed -n \
                  's/.*<!-- ai-code-review-fingerprint:\([a-f0-9]\{64\}\) -->.*/\1/p' \
                | head -n 1
            )

            if [ -z "$FINGERPRINT" ]; then
              continue
            fi

            if [ "${SEEN_FINGERPRINTS[$FINGERPRINT]+x}" ]; then
              echo "Deleting duplicate inline AI comment:"
              echo "  ID: $COMMENT_ID"
              echo "  fingerprint: $FINGERPRINT"

              gh api \
                --method DELETE \
                "repos/$REPOSITORY/pulls/comments/$COMMENT_ID"

              continue
            fi

            SEEN_FINGERPRINTS[$FINGERPRINT]=1

          done < <(
            jq -c '.[]' existing-inline-comments.json
          )

          echo
          echo "Checking general comments for duplicates..."

          while IFS= read -r comment; do
            COMMENT_ID=$(echo "$comment" | jq -r '.id')
            BODY=$(echo "$comment" | jq -r '.body // ""')

            FINGERPRINTS=$(
              printf '%s\n' "$BODY" \
                | grep -oE \
                  'ai-code-review-fingerprint:[a-f0-9]{64}' \
                | sed 's/ai-code-review-fingerprint://' \
                || true
            )

            if [ -z "$FINGERPRINTS" ]; then
              continue
            fi

            DUPLICATE_COMMENT=false

            while IFS= read -r FINGERPRINT; do
              [ -z "$FINGERPRINT" ] && continue

              if [ "${SEEN_FINGERPRINTS[$FINGERPRINT]+x}" ]; then
                DUPLICATE_COMMENT=true

                echo "Duplicate general AI comment:"
                echo "  ID: $COMMENT_ID"
                echo "  fingerprint: $FINGERPRINT"

                break
              fi

              SEEN_FINGERPRINTS[$FINGERPRINT]=1

            done <<< "$FINGERPRINTS"

            if [ "$DUPLICATE_COMMENT" = "true" ]; then
              echo "Deleting duplicate general AI comment:"
              echo "  ID: $COMMENT_ID"

              gh api \
                --method DELETE \
                "repos/$REPOSITORY/issues/comments/$COMMENT_ID"
            fi

          done < <(
            jq -c '.[]' existing-general-comments.json
          )

      # ================================================================
      # Build current fingerprint list
      # ================================================================

      - name: Build existing finding fingerprints
        if: >
          steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        shell: bash
        run: |
          set -euo pipefail

          rm -f existing-fingerprints.txt
          touch existing-fingerprints.txt

          jq -r '
            .[]
            | .body // ""
            | scan("ai-code-review-fingerprint:[a-f0-9]{64}")
            | sub("ai-code-review-fingerprint:"; "")
          ' existing-inline-comments.json \
            >> existing-fingerprints.txt || true

          jq -r '
            .[]
            | .body // ""
            | scan("ai-code-review-fingerprint:[a-f0-9]{64}")
            | sub("ai-code-review-fingerprint:"; "")
          ' existing-general-comments.json \
            >> existing-fingerprints.txt || true

          sort -u \
            existing-fingerprints.txt \
            -o existing-fingerprints.txt

          echo "Existing AI finding fingerprints:"
          cat existing-fingerprints.txt || true

      # ================================================================
      # Post new inline findings
      # ================================================================

      - name: Post new inline AI findings
        if: >
          steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          POSTED=0
          SKIPPED=0

          while IFS= read -r comment; do
            FINGERPRINT=$(echo "$comment" | jq -r '.fingerprint')

            if grep -Fxq \
              "$FINGERPRINT" \
              existing-fingerprints.txt; then

              echo "Skipping existing inline finding:"
              echo "  fingerprint: $FINGERPRINT"

              SKIPPED=$((SKIPPED + 1))

              continue
            fi

            BODY=$(echo "$comment" | jq -r '.body')
            PATH_VALUE=$(echo "$comment" | jq -r '.path')
            LINE=$(echo "$comment" | jq -r '.line')
            SIDE=$(echo "$comment" | jq -r '.side')

            echo "Posting new inline finding:"
            echo "  ${PATH_VALUE}:${LINE}"
            echo "  fingerprint: $FINGERPRINT"

            gh api \
              --method POST \
              "repos/$REPOSITORY/pulls/$PR_NUMBER/comments" \
              -f body="$BODY" \
              -f commit_id="$HEAD_SHA" \
              -f path="$PATH_VALUE" \
              -F line="$LINE" \
              -f side="$SIDE"

            printf '%s\n' "$FINGERPRINT" \
              >> existing-fingerprints.txt

            POSTED=$((POSTED + 1))

          done < <(
            jq -c '.[]' review-inline-comments.json
          )

          echo
          echo "Inline findings posted: $POSTED"
          echo "Inline findings skipped: $SKIPPED"

      # ================================================================
      # Post new general findings
      # ================================================================

      - name: Post new general AI findings
        if: >
          steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true' &&
          steps.validate-review.outputs.findings_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail

          POSTED=0
          SKIPPED=0

          while IFS= read -r finding; do
            FINGERPRINT=$(echo "$finding" | jq -r '.fingerprint')

            if grep -Fxq \
              "$FINGERPRINT" \
              existing-fingerprints.txt; then

              echo "Skipping existing general finding:"
              echo "  fingerprint: $FINGERPRINT"

              SKIPPED=$((SKIPPED + 1))

              continue
            fi

            BODY=$(echo "$finding" | jq -r '.body')

            echo "Posting new general finding:"
            echo "  fingerprint: $FINGERPRINT"

            gh api \
              --method POST \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments" \
              -f body="$BODY"

            printf '%s\n' "$FINGERPRINT" \
              >> existing-fingerprints.txt

            POSTED=$((POSTED + 1))

          done < <(
            jq -c '.[]' review-general-comments.json
          )

          echo
          echo "General findings posted: $POSTED"
          echo "General findings skipped: $SKIPPED"

      # ================================================================
      # Cleanup temporary files
      # ================================================================

      - name: Cleanup review comment files
        if: always() && steps.ai-code-fix-agent.outputs.is_ai-code-fix-agent_commit != 'true'
        shell: bash
        run: |
          rm -f \
            ai-review.txt \
            changed-lines.diff \
            changed-lines.json \
            review-inline-comments.json \
            review-general-comments.json \
            existing-inline-pages.json \
            existing-general-pages.json \
            existing-inline-comments.json \
            existing-general-comments.json \
            existing-fingerprints.txt \
            no-findings.md
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ai-code-review:
    name: ai-code-review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Agent 2 commit
        id: agent2
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MESSAGE=$(git log -1 --pretty=%B "${{ github.event.pull_request.head.sha }}")

          echo "Latest commit:"
          echo "${COMMIT_MESSAGE}"

          if [ "$COMMIT_MESSAGE" = "Apply AI code fixes" ]; then
            echo "is_agent2_commit=true" >> "$GITHUB_OUTPUT"
            echo "This commit was created by Agent 2. Skipping AI Code Review."
          else
            echo "is_agent2_commit=false" >> "$GITHUB_OUTPUT"
            echo "This commit was created by the developer. AI Code Review will run."
          fi

      - name: Setup PHP
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl
          coverage: none
          ini-file: production
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run AI Code Review
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_RETRY_DELAY: 1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Reviewing PHP changes: $BASE_SHA → $HEAD_SHA"

          php bin/console ai:review \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            --output=review-result.json \
            | tee ai-review.txt

          test -f review-result.json

          echo "Binding review-result.json to:"
          echo "commit_sha = $HEAD_SHA"
          echo "base_sha   = $BASE_SHA"

          php -r '
          $file = "review-result.json";

          $data = json_decode(
              file_get_contents($file),
              true,
              512,
              JSON_THROW_ON_ERROR
          );

          $data["commit_sha"] = $data["commit_sha"] ?? getenv("HEAD_SHA");
          $data["base_sha"] = getenv("BASE_SHA");

          file_put_contents(
              $file,
              json_encode(
                  $data,
                  JSON_PRETTY_PRINT |
                  JSON_UNESCAPED_SLASHES |
                  JSON_THROW_ON_ERROR
              ) . PHP_EOL
          );
          '

      - name: Validate review result
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          REVIEW_FILE="review-result.json"
          EXPECTED_SHA="${{ github.event.pull_request.head.sha }}"
          EXPECTED_BASE_SHA="${{ github.event.pull_request.base.sha }}"

          test -s "$REVIEW_FILE"

          php -r '
          $data = json_decode(
              file_get_contents($argv[1]),
              true,
              512,
              JSON_THROW_ON_ERROR
          );

          foreach (["commit_sha", "base_sha"] as $field) {
              if (
                  !isset($data[$field]) ||
                  !is_string($data[$field]) ||
                  $data[$field] === ""
              ) {
                  fwrite(
                      STDERR,
                      "Missing or invalid {$field} in review result.\n"
                  );
                  exit(1);
              }
          }

          if (
              isset($data["findings"]) &&
              !is_array($data["findings"])
          ) {
              fwrite(
                  STDERR,
                  "Invalid findings structure.\n"
              );
              exit(1);
          }
          ' "$REVIEW_FILE"

          REVIEW_SHA=$(jq -r '.commit_sha' "$REVIEW_FILE")
          REVIEW_BASE_SHA=$(jq -r '.base_sha' "$REVIEW_FILE")

          echo "Expected commit SHA: $EXPECTED_SHA"
          echo "Review commit SHA:   $REVIEW_SHA"
          echo "Expected base SHA:   $EXPECTED_BASE_SHA"
          echo "Review base SHA:     $REVIEW_BASE_SHA"

          if [ "$REVIEW_SHA" != "$EXPECTED_SHA" ]; then
            echo "Review result does not belong to the current PR commit."
            exit 1
          fi

          if [ "$REVIEW_BASE_SHA" != "$EXPECTED_BASE_SHA" ]; then
            echo "Review result belongs to a different PR base."
            exit 1
          fi

          echo "Review result is bound to the current PR HEAD and BASE."

      - name: Debug review result structure
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "===== review-result.json ====="
          cat review-result.json

          echo
          echo "===== top-level JSON keys ====="
          jq -r 'keys[]' review-result.json

      - name: Upload review artifact
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ github.event.pull_request.head.sha }}
          path: review-result.json
          if-no-files-found: error
          retention-days: 7

      - name: Prepare changed lines
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          git diff \
            --no-color \
            --unified=0 \
            "$BASE_SHA" \
            "$HEAD_SHA" \
            -- '*.php' \
            > changed-lines.diff

          echo "Changed PHP diff:"
          cat changed-lines.diff

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $diff = file_get_contents('changed-lines.diff');

          $changedLines = [];
          $currentFile = null;
          $currentLine = null;
          $currentCount = 0;

          foreach (preg_split('/\R/', $diff) as $line) {
              if (str_starts_with($line, '+++ b/')) {
                  $currentFile = substr($line, 6);
                  $currentLine = null;
                  $currentCount = 0;

                  echo "File: {$currentFile}\n";

                  continue;
              }

              if (
                  preg_match(
                      '/^@@\s+-\d+(?:,\d+)?\s+\+(\d+)(?:,(\d+))?/ ',
                      $line,
                      $matches
                  )
              ) {
                  $currentLine = (int) $matches[1];
                  $currentCount = isset($matches[2])
                      ? (int) $matches[2]
                      : 1;

                  echo sprintf(
                      "Hunk: %s line=%d count=%d\n",
                      $currentFile ?? 'unknown',
                      $currentLine,
                      $currentCount
                  );

                  if (
                      $currentFile !== null &&
                      $currentCount > 0
                  ) {
                      $changedLines[$currentFile] ??= [];

                      for ($i = 0; $i < $currentCount; $i++) {
                          $changedLines[$currentFile][] =
                              $currentLine + $i;
                      }
                  }

                  continue;
              }
          }

          foreach ($changedLines as $file => $lines) {
              $lines = array_values(array_unique($lines));
              sort($lines);

              $changedLines[$file] = $lines;

              echo sprintf(
                  "Changed lines: %s => %s\n",
                  $file,
                  implode(', ', $lines)
              );
          }

          file_put_contents(
              'changed-lines.json',
              json_encode(
                  $changedLines,
                  JSON_PRETTY_PRINT |
                  JSON_UNESCAPED_SLASHES |
                  JSON_THROW_ON_ERROR
              ) . PHP_EOL
          );

          echo "Changed-line map prepared.\n";
          PHP

      - name: Post line review comments
        if: steps.agent2.outputs.is_agent2_commit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          php <<'PHP'
          <?php

          declare(strict_types=1);

          $reviewFile = 'review-result.json';
          $changedLinesFile = 'changed-lines.json';

          $data = json_decode(
              file_get_contents($reviewFile),
              true,
              512,
              JSON_THROW_ON_ERROR
          );

          $changedLines = json_decode(
              file_get_contents($changedLinesFile),
              true,
              512,
              JSON_THROW_ON_ERROR
          );

          $comments = [];

          if (
              !isset($data['reviews']) ||
              !is_array($data['reviews'])
          ) {
              echo "No reviews section found.\n";

              file_put_contents(
                  'review-comments.json',
                  "[]\n"
              );

              exit(0);
          }

          foreach ($data['reviews'] as $file => $review) {
              if (!is_array($review)) {
                  continue;
              }

              if (
                  !isset($review['findings']) ||
                  !is_array($review['findings'])
              ) {
                  echo "No findings for {$file}.\n";
                  continue;
              }

              $file = ltrim((string) $file, '/');

              echo "Processing file: {$file}\n";

              $availableLines = $changedLines[$file] ?? [];

              echo "Changed lines: " .
                  ($availableLines === []
                      ? 'NONE'
                      : implode(', ', $availableLines)) .
                  "\n";

              foreach ($review['findings'] as $finding) {
                  if (!is_array($finding)) {
                      continue;
                  }

                  if (
                      !isset($finding['line']) ||
                      !is_numeric($finding['line'])
                  ) {
                      echo "Skipping finding without a valid line.\n";
                      continue;
                  }

                  $line = (int) $finding['line'];

                  $message = isset($finding['message'])
                      ? (string) $finding['message']
                      : '';

                  $severity = isset($finding['severity'])
                      ? (string) $finding['severity']
                      : '';

                  $category = isset($finding['category'])
                      ? (string) $finding['category']
                      : '';

                  $suggestion = isset($finding['suggestion'])
                      ? (string) $finding['suggestion']
                      : '';

                  echo "Finding: {$file}:{$line}\n";

                  if ($message === '') {
                      echo "  SKIPPED: finding has no message.\n";
                      continue;
                  }

                  if (
                      !in_array(
                          $line,
                          $availableLines,
                          true
                      )
                  ) {
                      echo "  SKIPPED: line {$line} is not a changed PR line.\n";
                      continue;
                  }

                  $body = '';

                  if ($severity !== '') {
                      $body .= '**' . strtoupper($severity) . '**';
                  }

                  if ($category !== '') {
                      if ($body !== '') {
                          $body .= ' · ';
                      }

                      $body .= $category;
                  }

                  if ($body !== '') {
                      $body .= "\n\n";
                  }

                  $body .= $message;

                  if ($suggestion !== '') {
                      $body .= "\n\n**Suggestion:** " . $suggestion;
                  }

                  $comments[] = [
                      'path' => $file,
                      'line' => $line,
                      'side' => 'RIGHT',
                      'body' => $body,
                  ];

                  echo "  MATCHED: PR line comment prepared.\n";
              }
          }

          $unique = [];

          foreach ($comments as $comment) {
              $key = implode('|', [
                  $comment['path'],
                  $comment['line'],
                  $comment['body'],
              ]);

              $unique[$key] = $comment;
          }

          $comments = array_values($unique);

          file_put_contents(
              'review-comments.json',
              json_encode(
                  $comments,
                  JSON_PRETTY_PRINT |
                  JSON_UNESCAPED_SLASHES |
                  JSON_THROW_ON_ERROR
              ) . PHP_EOL
          );

          echo "\nPrepared " .
              count($comments) .
              " valid PR line review comment(s).\n";
          PHP

          COMMENT_COUNT=$(jq 'length' review-comments.json)

          echo "Comment count: $COMMENT_COUNT"

          if [ "$COMMENT_COUNT" -eq 0 ]; then
            echo "No findings can be attached to changed PR lines."
            exit 0
          fi

          jq \
            --arg commit_id "$HEAD_SHA" \
            --argjson comments "$(cat review-comments.json)" \
            '{
              commit_id: $commit_id,
              event: "COMMENT",
              body: "AI Code Review",
              comments: $comments
            }' \
            > review-payload.json

          echo "GitHub review payload:"
          cat review-payload.json

          gh api \
            --method POST \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --input review-payload.json

          rm -f \
            review-comments.json \
            review-payload.json \
            changed-lines.diff \
            changed-lines.json